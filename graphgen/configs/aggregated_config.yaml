# LLM 与其他 API 配置（可选；未配置时回退到环境变量/.env）
# ${VAR} 引用环境变量，密钥无需写进配置文件。
# 优先级：命令行参数 > 本文件 > 环境变量 > 内置默认值
llm:
  synthesizer:
    model: ${SYNTHESIZER_MODEL}
    base_url: ${SYNTHESIZER_BASE_URL}
    api_key: ${SYNTHESIZER_API_KEY}
    rpm: 1000   # 每分钟请求数上限
    tpm: 50000  # 每分钟 token 数上限
    temperature: 0.0
    max_tokens: 4096
  trainee:
    enabled: false  # quiz_and_judge.enabled 时需要
    model: ${TRAINEE_MODEL}
    base_url: ${TRAINEE_BASE_URL}
    api_key: ${TRAINEE_API_KEY}
  tokenizer:
    model: cl100k_base

# 其他 API（搜索等），值会写入对应环境变量供各模块读取
apis: {}
#  google_search:
#    api_key: ${GOOGLE_SEARCH_API_KEY}
#    cx: ${GOOGLE_SEARCH_CX}
#  bing_search:
#    api_key: ${BING_SEARCH_API_KEY}

read:
  input_file: resources/input_examples/jsonl_demo.jsonl # input file path, support json, jsonl, txt, pdf. See resources/input_examples for examples
split:
  chunk_size: 1024 # chunk size for text splitting
  chunk_overlap: 100 # chunk overlap for text splitting
  # 批量请求优化参数
  enable_batch_requests: true
  batch_size: 30
  max_wait_time: 1.0
  use_adaptive_batching: true
  min_batch_size: 10
  max_batch_size: 50
  enable_extraction_cache: true
  # Prompt合并优化
  enable_prompt_merging: true
  prompt_merge_size: 5
search: # web search configuration
  enabled: false # whether to enable web search
  search_types: ["google"] # search engine types, support: google, bing, uniprot, wikipedia
quiz_and_judge: # quiz and test whether the LLM masters the knowledge points
  enabled: true
  quiz_samples: 2 # number of quiz samples to generate
  re_judge: false # whether to re-judge the existing quiz samples
  enable_batch_requests: true
  batch_size: 30
  max_wait_time: 1.0
partition: # graph partition configuration
  method: ece # ece is a custom partition method based on comprehension loss
  method_params:
    max_units_per_community: 20 # max nodes and edges per community
    min_units_per_community: 5 # min nodes and edges per community
    max_tokens_per_community: 10240 # max tokens per community
    unit_sampling: max_loss # unit sampling strategy, support: random, max_loss, min_loss
generate:
  mode: aggregated # atomic, aggregated, multi_hop, cot
  data_format: ChatML # Alpaca, Sharegpt, ChatML
  # 批量请求优化
  enable_batch_requests: true
  batch_size: 30
  max_wait_time: 1.0
  use_adaptive_batching: true
  min_batch_size: 10
  max_batch_size: 50
  # 缓存优化
  enable_prompt_cache: true
  cache_max_size: 50000
  cache_ttl: null
  # 合并模式优化（减少50%调用）
  use_combined_mode: true
  # 去重优化
  enable_deduplication: true
  persistent_deduplication: true
